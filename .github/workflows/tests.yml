# Tests de l'app, puis publication sur GitHub Pages.
name: Tests et publication

# Sur chaque PR vers main : les trois contrôles ci-dessous, à rendre
# obligatoires dans les règles de la branche main (Settings → Rules → Rulesets).
# Sur main (après fusion) : les tests, puis la publication si tout passe.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitaires:
    name: Tests unitaires
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe de tous les fichiers JavaScript
        run: node outils/verifier-syntaxe.cjs sw.js js/*.js vendor/*.js
      - name: Logique (montants, QIF, récurrences, relevés), version, fichiers
        run: npm test

  navigateur:
    name: Parcours navigateur
    # Version d'Ubuntu fixée : Playwright 1.56 ne gère pas encore ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parcours complets dans Chromium
        run: npm run test:navigateur

  appli:
    name: Appli Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: App web copiée dans le projet Android
        working-directory: mobile
        run: npm ci && npm run preparer
      - name: Construction de l'APK (signé si la clé est dans les secrets)
        working-directory: mobile/android
        env:
          CLE: ${{ secrets.ANDROID_CLE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_CLE_MOT_DE_PASSE }}
          CLE_ALIAS: mes-comptes
        run: |
          if [ -n "$CLE" ]; then
            echo "$CLE" | base64 -d > "$RUNNER_TEMP/cle.jks"
            export CLE_FICHIER="$RUNNER_TEMP/cle.jks"
          else
            echo "::warning::Secrets ANDROID_CLE / ANDROID_CLE_MOT_DE_PASSE absents : APK non signé, ni installable ni publié."
          fi
          ./gradlew --no-daemon assembleRelease
          rm -f "$RUNNER_TEMP/cle.jks"
      - name: APK, version.json et page d'installation (publiés avec le site, dossier android/)
        run: |
          v="$(grep -oP "VERSION = '\K[\d.]+" js/app.js)"
          mkdir -p _appli
          if [ -f mobile/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk "_appli/mes-comptes-$v.apk"
            sed "s/__VERSION__/$v/g" mobile/installer.html > _appli/index.html   # lien fixe : …/android/
            printf '{ "version": "%s", "apk": "https://marynedey.github.io/Comptabilite/android/mes-comptes-%s.apk" }\n' "$v" "$v" > _appli/version.json
          fi
          ls -l _appli
      - uses: actions/upload-artifact@v4
        if: hashFiles('_appli/version.json') != ''
        with:
          name: appli-android
          path: _appli/
          retention-days: 30

  version:
    name: Version augmentée
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: La version doit augmenter si l'app change
        run: node outils/verifier-version.mjs origin/${{ github.base_ref }}

  publier:
    name: Publication
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [unitaires, navigateur, appli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # étiquette de version (v2.0.0…)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Uniquement les fichiers de l'app (ni tests ni outils)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor icons _site/
      - name: Appli Android (si l'APK a été signé)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: appli-android
          path: _site/android/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
      - name: Étiquette de la version publiée (onglet « Tags » du dépôt)
        run: |
          v="v$(grep -oP "VERSION = '\K[\d.]+" js/app.js)"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "$v existe déjà"; exit 0; fi
          git tag "$v" && git push origin "$v"
